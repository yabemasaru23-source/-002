<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>時間創造部 ─ 今を生きる人のための、時間学</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700;900&family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Shippori+Mincho:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    /* default palette: 墨朱 ink & vermilion */
    --ink:#0d0c0a;
    --ink-2:#1a1815;
    --ink-3:#2a2722;
    --paper:#f3ede1;
    --paper-2:#e6dfcf;
    --muted:rgba(243,237,225,.62);
    --muted-2:rgba(243,237,225,.38);
    --rule:rgba(243,237,225,.14);
    --accent:#d7402c;       /* 朱 vermilion */
    --accent-soft:#e6745e;
    --gold:#c9a961;

    --serif:"Shippori Mincho","Noto Serif JP",serif;
    --sans:"Noto Sans JP",ui-sans-serif,system-ui,sans-serif;
    --display:var(--serif);
    --latin:"Cormorant Garamond","Noto Serif JP",serif;
    --mono:"Inter",ui-sans-serif,system-ui;

    --container:1280px;
    --gutter:clamp(20px,4vw,56px);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* palette variants */
  body[data-palette="porcelain"]{
    --ink:#f3ede1;
    --ink-2:#ebe3d3;
    --ink-3:#dfd5c1;
    --paper:#0d0c0a;
    --paper-2:#1a1815;
    --muted:rgba(13,12,10,.62);
    --muted-2:rgba(13,12,10,.38);
    --rule:rgba(13,12,10,.14);
    --accent:#c63320;
    --accent-soft:#a32214;
    --gold:#9a7e3f;
  }
  body[data-palette="midnight"]{
    --ink:#070d18;
    --ink-2:#0d1626;
    --ink-3:#162035;
    --paper:#f1ece0;
    --paper-2:#dcd3c2;
    --muted:rgba(241,236,224,.62);
    --muted-2:rgba(241,236,224,.38);
    --rule:rgba(241,236,224,.14);
    --accent:#e8b54a;
    --accent-soft:#f1c878;
    --gold:#e8b54a;
  }

  body[data-display="sans"]{ --display:var(--sans); }

  ::selection{background:var(--accent);color:var(--ink)}

  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}

  /* utilities */
  .wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
  .eyebrow{
    font-family:var(--latin);
    font-style:italic;
    font-weight:400;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:none;
  }
  .eyebrow .num{
    font-family:var(--latin);
    font-style:normal;
    color:var(--paper);
    margin-right:14px;
    opacity:.55;
  }
  .ja-eyebrow{
    font-family:var(--sans);
    font-weight:500;
    font-size:11px;
    letter-spacing:.4em;
    color:var(--paper);
    opacity:.55;
  }
  .rule{height:1px;background:var(--rule);width:100%}
  .v-rule{width:1px;background:var(--rule)}
  .vert-jp{
    writing-mode:vertical-rl;
    text-orientation:upright;
    letter-spacing:.2em;
  }
  .tabular{font-variant-numeric:tabular-nums}

  /* scroll-driven entrance */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  body[data-motion="off"] .reveal{opacity:1;transform:none;transition:none}

  /* TOP NAV */
  .topnav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px var(--gutter);
    background:linear-gradient(to bottom,var(--ink) 0%,rgba(0,0,0,0) 100%);
    transition:background .3s ease,backdrop-filter .3s ease;
  }
  .topnav.scrolled{
    background:color-mix(in srgb,var(--ink) 82%,transparent);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--rule);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--paper);
    display:grid;place-items:center;position:relative;
  }
  .brand .mark::before{
    content:"";position:absolute;inset:-1px;border-radius:50%;
    border-top:1px solid var(--accent);
    transform:rotate(var(--mark-rot,42deg));
    transition:transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .brand .mark span{
    font-family:var(--display);font-weight:700;font-size:18px;line-height:1;
    color:var(--paper);
  }
  .brand .name{
    font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;
  }
  .brand .name small{
    display:block;font-family:var(--latin);font-style:italic;font-size:10px;
    letter-spacing:.24em;opacity:.55;margin-top:2px;
  }
  .nav-links{display:flex;align-items:center;gap:28px}
  .nav-links a{
    font-size:13px;letter-spacing:.08em;font-weight:500;
    opacity:.7;transition:opacity .2s;
    position:relative;padding:6px 0;
  }
  .nav-links a:hover{opacity:1}
  .nav-links .cta{
    background:var(--accent);color:var(--ink);
    padding:10px 18px;border-radius:999px;
    font-weight:600;letter-spacing:.06em;opacity:1;
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .nav-links .cta:hover{transform:translateY(-1px);box-shadow:0 10px 24px -8px var(--accent)}
  @media (max-width:880px){
    .nav-links a:not(.cta){display:none}
  }

  /* HERO */
  .hero{
    position:relative;
    min-height:100vh;
    padding:140px var(--gutter) 80px;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:40px;
    align-items:end;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(900px 600px at 88% 12%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),
      radial-gradient(700px 500px at 8% 88%,color-mix(in srgb,var(--gold) 8%,transparent),transparent 70%);
    opacity:.9;
  }
  .hero-grain{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
  }
  .hero-clock{
    position:absolute;
    right:max(2vw,24px);
    top:50%;
    width:min(78vmin,860px);
    aspect-ratio:1;
    pointer-events:none;
    opacity:1;
    transform:translate(0,-50%);
    z-index:2;
    filter:drop-shadow(0 0 60px color-mix(in srgb,var(--accent) 70%,transparent)) drop-shadow(0 28px 90px rgba(0,0,0,.7)) contrast(1.18) saturate(1.15);
    stroke-width:3;
  }
  .hero-clock svg *{stroke-width:inherit !important}
  .hero-clock svg [stroke]{stroke-width:3.5 !important}
  .hero-clock-glow{
    position:absolute;right:-8%;top:50%;
    width:min(90vmin,920px);aspect-ratio:1;
    transform:translate(0,-50%);
    background:radial-gradient(circle,color-mix(in srgb,var(--accent) 32%,transparent) 0%,transparent 58%);
    pointer-events:none;z-index:0;
  }
  @media (max-width:1100px){
    .hero-clock{opacity:.85;width:min(80vmin,620px);right:-8%;transform:translate(0,-50%)}
    .hero-clock-glow{opacity:.5}
  }
  @media (max-width:780px){
    .hero{grid-template-columns:1fr !important}
    .hero-clock{opacity:.92;position:relative;right:auto;top:auto;transform:none;width:min(86vw,520px);margin:24px auto 8px;display:block}
    .hero-clock-glow{display:none}
  }

  .hero-inner{position:relative;z-index:2;max-width:1100px}
  .hero-meta{
    display:flex;align-items:center;gap:18px;
    margin-bottom:48px;
  }
  .hero-meta .live{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    color:var(--paper);opacity:.85;
  }
  .hero-meta .dot{
    width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 var(--accent);
    animation:pulse 1.6s ease-out infinite;
  }
  body[data-motion="off"] .hero-meta .dot{animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}
    70%{box-shadow:0 0 0 12px transparent}
    100%{box-shadow:0 0 0 0 transparent}
  }

  .hero h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(58px,11.5vw,168px);
    line-height:.92;
    letter-spacing:-.01em;
    margin:0 0 36px;
    color:var(--paper);
  }
  .hero h1 .accent{color:var(--accent);position:relative;display:inline-block}
  .hero h1 .accent::after{
    content:"";position:absolute;left:6%;right:6%;bottom:-.04em;height:.06em;background:var(--accent);
    transform:scaleX(0);transform-origin:left;transition:transform 1.4s cubic-bezier(.2,.7,.2,1) .6s;
  }
  .hero.in h1 .accent::after{transform:scaleX(1)}
  .hero h1 .ima{
    display:inline-block;font-size:1.18em;font-weight:900;
    letter-spacing:-.04em;
    text-shadow:0 0 1px var(--accent);
    transform:translateY(.04em);
  }
  .hero h1 .grid-mark{
    position:relative;display:inline-block;
  }
  .hero h1 .grid-mark::before{
    content:"";position:absolute;left:50%;top:-22px;width:1px;height:14px;background:var(--accent);
  }

  .hero-sub{
    max-width:640px;
    font-family:var(--display);
    font-size:clamp(17px,2vw,22px);
    line-height:1.85;
    color:var(--paper);
    opacity:.86;
    font-weight:300;
  }
  .hero-sub strong{font-weight:600;color:var(--accent)}

  .hero-cta-row{
    margin-top:52px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 28px;border-radius:999px;
    font-size:14px;font-weight:600;letter-spacing:.06em;
    cursor:pointer;border:0;
    transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .btn-primary{background:var(--accent);color:var(--ink)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -16px var(--accent)}
  .btn-ghost{
    background:transparent;color:var(--paper);
    border:1px solid var(--rule);
  }
  .btn-ghost:hover{border-color:var(--paper);background:color-mix(in srgb,var(--paper) 6%,transparent)}
  .btn .arrow{display:inline-block;transition:transform .2s}
  .btn:hover .arrow{transform:translateX(3px)}

  .hero-side{
    position:relative;z-index:2;
    align-self:end;
    display:flex;flex-direction:column;align-items:flex-end;gap:36px;
    padding-bottom:8px;
  }
  .hero-side .vert-jp{
    font-family:var(--display);
    font-size:14px;
    color:var(--muted);
    line-height:1.8;
    letter-spacing:.4em;
  }
  .hero-time{
    text-align:right;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--muted);
    line-height:1.6;
  }
  .hero-time .big{
    display:block;
    font-family:var(--latin);font-style:italic;
    font-size:48px;color:var(--paper);letter-spacing:.02em;
    line-height:1;margin-bottom:6px;
  }
  @media (max-width:880px){
    .hero{grid-template-columns:1fr;padding-top:120px}
    .hero-side{align-self:start;flex-direction:row;align-items:center;justify-content:space-between;width:100%}
    .hero-side .vert-jp{display:none}
  }

  /* HERO SCROLL HINT */
  .scroll-hint{
    position:absolute;left:var(--gutter);bottom:32px;z-index:3;
    display:flex;align-items:center;gap:14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);
  }
  .scroll-hint .line{
    width:60px;height:1px;background:var(--paper);position:relative;overflow:hidden;
  }
  .scroll-hint .line::after{
    content:"";position:absolute;left:-30%;top:0;height:100%;width:30%;
    background:var(--accent);
    animation:scrollLine 2.4s ease-in-out infinite;
  }
  body[data-motion="off"] .scroll-hint .line::after{animation:none}
  @keyframes scrollLine{
    0%{left:-30%}50%{left:100%}100%{left:100%}
  }

  /* SECTION SCAFFOLD */
  section.section{
    position:relative;
    padding:clamp(80px,12vh,160px) var(--gutter);
    border-top:1px solid var(--rule);
  }
  .section-head{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:48px;
    align-items:end;
    margin-bottom:64px;
  }
  .section-head .num{
    font-family:var(--latin);
    font-style:italic;
    font-size:96px;
    line-height:1;
    color:var(--accent);
    opacity:.95;
  }
  .section-head h2{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(32px,5vw,68px);
    line-height:1.05;
    letter-spacing:-.01em;
    margin:0;
  }
  .section-head .lead{
    margin-top:14px;font-family:var(--display);
    font-size:clamp(15px,1.4vw,18px);font-weight:300;line-height:1.85;
    color:var(--muted);max-width:62ch;
  }
  @media (max-width:720px){
    .section-head{grid-template-columns:1fr;gap:24px}
    .section-head .num{font-size:64px}
  }

  /* PROBLEM / EMPATHY */
  .empathy{
    background:var(--ink-2);
  }
  .empathy h2 em{
    font-style:normal;color:var(--accent);font-weight:700;
  }
  .empathy-grid{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:0;border-top:1px solid var(--rule);
  }
  .empathy-card{
    padding:36px 32px 36px 0;
    border-bottom:1px solid var(--rule);
    position:relative;
  }
  .empathy-card:nth-child(odd){padding-right:48px;border-right:1px solid var(--rule)}
  .empathy-card:nth-child(even){padding-left:48px}
  .empathy-card .pain-num{
    font-family:var(--latin);font-style:italic;font-size:13px;
    color:var(--accent);opacity:.8;letter-spacing:.18em;margin-bottom:18px;
  }
  .empathy-card h3{
    font-family:var(--display);font-weight:600;font-size:24px;line-height:1.4;
    margin:0 0 12px;color:var(--paper);
  }
  .empathy-card p{
    font-size:14.5px;line-height:1.85;color:var(--muted);margin:0;
  }
  @media (max-width:720px){
    .empathy-grid{grid-template-columns:1fr}
    .empathy-card,.empathy-card:nth-child(odd){padding:32px 0;border-right:0}
    .empathy-card:nth-child(even){padding-left:0}
  }

  /* PILLARS */
  .pillars{}
  .pillar-row{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:0;border-top:1px solid var(--rule);
  }
  .pillar{
    padding:48px 36px;
    border-right:1px solid var(--rule);
    position:relative;
    overflow:hidden;
    transition:background .3s ease;
  }
  .pillar:last-child{border-right:0}
  .pillar:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}
  .pillar .kanji{
    position:absolute;right:8px;top:-20px;
    font-family:var(--display);font-weight:900;font-size:200px;line-height:1;
    color:color-mix(in srgb,var(--paper) 6%,transparent);
    pointer-events:none;user-select:none;
    transition:color .3s ease,transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .pillar:hover .kanji{
    color:color-mix(in srgb,var(--accent) 16%,transparent);
    transform:translateY(-8px);
  }
  .pillar .pillar-meta{
    display:flex;align-items:center;gap:14px;margin-bottom:36px;
  }
  .pillar .num{
    font-family:var(--latin);font-style:italic;font-size:15px;color:var(--accent);
    letter-spacing:.18em;
  }
  .pillar h3{
    font-family:var(--display);font-weight:700;font-size:36px;line-height:1.2;
    margin:0 0 8px;
  }
  .pillar .label{
    font-family:var(--latin);font-style:italic;font-size:14px;
    color:var(--muted);letter-spacing:.14em;margin-bottom:24px;
  }
  .pillar p{
    font-size:14.5px;line-height:1.9;color:var(--muted);margin:0 0 18px;
    position:relative;z-index:1;
  }
  .pillar blockquote{
    margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--rule);
    font-family:var(--display);font-style:italic;font-size:14px;line-height:1.7;
    color:var(--paper);opacity:.9;
    position:relative;z-index:1;
  }
  @media (max-width:880px){
    .pillar-row{grid-template-columns:1fr}
    .pillar{border-right:0;border-bottom:1px solid var(--rule)}
  }

  /* THREE TIME AXES — interactive */
  .axes{
    background:var(--ink-2);
  }
  .axes-stage{
    position:relative;
    background:var(--ink);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:36px clamp(24px,4vw,56px) 56px;
  }
  .axes-stage .stage-head{
    display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:18px;
    margin-bottom:32px;
  }
  .axes-stage .age-display{
    font-family:var(--display);font-weight:600;
    font-size:clamp(28px,4vw,46px);line-height:1;color:var(--paper);
    letter-spacing:-.01em;
  }
  .axes-stage .age-display em{font-style:normal;color:var(--accent);font-weight:700}
  .axes-stage .age-sub{
    font-family:var(--latin);font-style:italic;color:var(--muted);font-size:14px;
    margin-top:6px;letter-spacing:.06em;
  }
  .axes-stage .axis-legend{
    display:flex;gap:24px;align-items:center;
    font-size:12px;color:var(--muted);letter-spacing:.14em;
  }
  .axes-stage .axis-legend i{
    width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:8px;vertical-align:middle;
  }

  .axis-rails{
    position:relative;
  }
  .axis-rail{
    display:grid;grid-template-columns:120px 1fr;
    align-items:center;gap:20px;
    padding:22px 0;border-top:1px solid var(--rule);
  }
  .axis-rail:last-child{border-bottom:1px solid var(--rule)}
  .axis-label{
    font-family:var(--display);font-weight:600;font-size:22px;color:var(--paper);
    line-height:1.2;
  }
  .axis-label .en{
    display:block;font-family:var(--latin);font-style:italic;font-size:12px;
    color:var(--muted);letter-spacing:.16em;margin-top:4px;
  }
  .axis-track{
    position:relative;height:64px;
  }
  .axis-line{
    position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule);
  }
  .axis-line::before{
    content:"";position:absolute;left:0;top:0;height:100%;
    background:linear-gradient(to right,var(--accent),color-mix(in srgb,var(--accent) 10%,transparent));
    width:var(--axis-progress,0%);
    transition:width .3s cubic-bezier(.2,.7,.2,1);
  }
  .axis-tick{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    width:10px;height:10px;border-radius:50%;
    background:var(--ink);border:1px solid var(--rule);
    transition:all .3s;
  }
  .axis-tick.passed{background:var(--accent);border-color:var(--accent)}
  .axis-tick.now{
    width:16px;height:16px;
    background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);
  }
  .axis-event{
    position:absolute;top:0;
    transform:translateX(-50%);
    text-align:center;
    font-size:11px;letter-spacing:.04em;color:var(--muted);
    white-space:nowrap;line-height:1.3;
    max-width:120px;
  }
  .axis-event.below{top:auto;bottom:0}
  .axis-event strong{display:block;color:var(--paper);font-weight:600;font-size:12px}

  .axis-now-line{
    position:absolute;top:0;bottom:0;
    left:var(--now-x,40%);
    width:1px;background:var(--accent);
    pointer-events:none;
    z-index:5;
  }
  .axis-now-line::before{
    content:"今";

    display:grid;
    grid-template-columns:1fr auto 1fr auto 1fr;
    align-items:center;gap:14px;
    margin:0 0 36px;
    padding:18px 24px;
    background:color-mix(in srgb,var(--accent) 8%,transparent);
    border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);
    border-radius:8px;
  }
  .axes-howto-step{display:flex;align-items:center;gap:14px}
  .axes-howto-step .step-num{
    flex-shrink:0;
    display:grid;place-items:center;
    width:32px;height:32px;border-radius:50%;
    background:var(--accent);color:var(--ink);
    font-family:var(--display);font-weight:700;font-size:16px;
  }
  .axes-howto-step .step-text{
    font-size:13.5px;line-height:1.5;color:var(--paper);
  }
  .axes-howto-step .step-text strong{color:var(--accent);font-weight:700}
  .axes-howto-arrow{
    color:var(--accent);font-size:24px;font-family:var(--latin);
    opacity:.7;
  }
  @media (max-width:880px){
    .axes-howto{grid-template-columns:1fr;gap:14px}
    .axes-howto-arrow{display:none}
  }

  /* ── scrubber refinements ── */
  .scrubber-wrap{
    margin-top:36px;
    padding:24px 28px;
    background:color-mix(in srgb,var(--accent) 6%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    border-radius:8px;
    position:relative;
  }
  .scrubber-label{
    display:flex;align-items:center;gap:10px;
    font-family:var(--display);font-weight:600;font-size:15px;
    color:var(--paper);margin-bottom:18px;
    letter-spacing:.04em;
  }
  .scrubber-arrow{
    display:inline-block;font-size:22px;color:var(--accent);
    animation:scrubBounce 1.4s ease-in-out infinite;
    transform-origin:center;
  }
  body[data-motion="off"] .scrubber-arrow{animation:none}
  @keyframes scrubBounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(6px)}
  }
  .scrubber-row{
    display:flex;align-items:center;gap:14px;
  }
  .scrubber-end{
    font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;
    min-width:24px;text-align:center;
  }
  .scrubber-row .scrubber{
    flex:1;height:6px;border-radius:6px;
    background:linear-gradient(to right,
      var(--accent) 0%, var(--accent) calc((var(--age,38) - 18) / 67 * 100%),
      var(--rule) calc((var(--age,38) - 18) / 67 * 100%), var(--rule) 100%);
  }
  .scrubber-row .scrubber::-webkit-slider-thumb{
    width:24px;height:24px;
    box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),
               0 4px 14px rgba(0,0,0,.4);
  }
  .scrubber-row .scrubber-val{
    font-family:var(--display);font-weight:700;
    font-size:22px;color:var(--accent);
    min-width:80px;text-align:right;
  }

  /* ── instructor portrait with clock background ── */
  .ins-portrait-photo{
    aspect-ratio:3/4;
    background:linear-gradient(160deg,#0a0a0e 0%,#1a1815 60%,#1d0d0a 100%);
    border:1px solid var(--rule);
    border-radius:6px;
    position:relative;overflow:hidden;
    display:block;
  }
  .ins-clock-bg{
    position:absolute;inset:-10%;
    pointer-events:none;
    color:color-mix(in srgb,var(--paper) 30%,transparent);
    z-index:1;
  }
  .ins-clock-bg svg{
    width:100%;height:100%;
    animation:slowSpin 60s linear infinite;
    transform-origin:center;
  }
  body[data-motion="off"] .ins-clock-bg svg{animation:none}
  @keyframes slowSpin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  .ins-portrait-img{
    position:absolute;inset:0;
    z-index:2;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .ins-portrait-img img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 18%;
    filter:contrast(1.05) saturate(.92);
    mix-blend-mode:luminosity;
    opacity:.96;
  }
  .ins-portrait-photo::after{
    content:"";position:absolute;inset:0;z-index:3;
    background:
      linear-gradient(to bottom,transparent 0%,transparent 55%,rgba(13,12,10,.85) 100%),
      radial-gradient(ellipse at center,transparent 30%,rgba(13,12,10,.45) 100%);
    pointer-events:none;
  }
  .ins-portrait-photo .name-mark{
    position:absolute;left:24px;bottom:20px;z-index:4;
    font-family:var(--display);font-weight:700;font-size:32px;color:var(--paper);line-height:1;
    text-shadow:0 2px 12px rgba(0,0,0,.7);
  }
  .ins-portrait-photo .name-mark small{
    display:block;font-family:var(--latin);font-style:italic;font-size:12px;
    color:var(--accent);letter-spacing:.18em;margin-top:6px;font-weight:400;
  }

  /* ── QM logo, monochrome / inverts on dark ── */
  .qm-logo-mono{
    filter:brightness(0) invert(1) opacity(.92);
    transition:filter .3s ease;
  }
  body[data-palette="porcelain"] .qm-logo-mono{
    filter:none;opacity:1;
  }
  .company-logo-card{
    background:color-mix(in srgb,var(--paper) 5%,transparent);
    border:1px solid var(--rule);
    padding:32px 28px;border-radius:6px;
    min-width:260px;text-align:center;
    align-self:start;
  }

/* ============================================================ */
/* IMAGE BAND — full-bleed photographic accents                  */
/* ============================================================ */
.image-band{
  position:relative;
  width:100%;
  height:clamp(280px,42vw,520px);
  overflow:hidden;
  margin:0;
}
.image-band img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(20%) contrast(1.05) brightness(.78);
  transition:transform 1.2s ease;
}
.image-band:hover img{transform:scale(1.04)}
.image-band::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,12,10,.55) 0%,rgba(13,12,10,.15) 50%,rgba(13,12,10,.65) 100%);
  pointer-events:none;
}
.image-band-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:clamp(20px,4vw,48px);
  z-index:2;
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  color:var(--paper);
}
.image-band-cap .lat{
  font-family:var(--latin);font-style:italic;font-size:clamp(28px,4vw,56px);
  font-weight:300;line-height:1;letter-spacing:.01em;
  text-shadow:0 4px 24px rgba(0,0,0,.5);
}
.image-band-cap .ja{
  font-family:var(--display);font-weight:600;
  font-size:clamp(13px,1.3vw,16px);
  letter-spacing:.18em;color:var(--accent);
}

/* Inline image card pairs */
.image-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  margin:48px auto;
  max-width:var(--container);
  padding:0 var(--gutter);
}
.image-pair .frame{
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  border-radius:4px;
  background:var(--ink-2);
}
.image-pair .frame img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(15%) contrast(1.05) brightness(.85);
}
.image-pair .frame::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(13,12,10,.6));
}
.image-pair .frame .label{
  position:absolute;bottom:18px;left:20px;right:20px;
  z-index:2;
  font-family:var(--display);font-weight:600;font-size:14px;
  letter-spacing:.08em;color:var(--paper);
}
.image-pair .frame .label em{
  display:block;
  font-family:var(--latin);font-style:italic;font-weight:400;
  font-size:11px;color:var(--accent);
  letter-spacing:.18em;margin-bottom:4px;
}
@media (max-width:780px){
  .image-pair{grid-template-columns:1fr;gap:14px}
  .image-band{height:260px}
}

.tn-quote{
  margin:0;padding:24px 28px;
  border-left:3px solid var(--accent);
  background:color-mix(in srgb,var(--paper) 4%,transparent);
  font-family:var(--display);font-size:clamp(16px,1.8vw,20px);line-height:1.9;
  color:var(--paper);
  font-weight:400;border-radius:0 6px 6px 0;
}
.tn-quote strong{color:var(--accent);font-weight:700;font-size:1.05em}
@media (max-width:780px){
  .tn-head{grid-template-columns:48px 1fr;gap:14px}
  .tn-num{display:none}
  .tn-icon{width:48px;height:48px;font-size:32px}
  .tn-title{font-size:18px !important;line-height:1.5 !important}
  .tn-examples{grid-template-columns:1fr;padding:18px;gap:14px}
  .tn-conclusion{grid-template-columns:1fr;gap:12px;padding:18px}
  .tn-conclusion-mark{justify-self:start}
  .tn-summary{padding:32px 22px}
  .tn-summary-list li{grid-template-columns:36px 1fr;font-size:14.5px !important;line-height:1.75 !important}
  .tn-quote{padding:20px;font-size:15px !important}
}

</style>
</head>
<body data-palette="porcelain" data-display="serif" data-motion="on" style="font-family: &quot;Noto Sans JP&quot;">

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

</body>
</html>
